<body>


<header id="site-header">

<div class="header-container">

<a
href="../index.html"
class="logo">

DarkensHorns

</a>


<nav class="main-navigation">

<a href="../index.html">
Home
</a>

<a href="series.html">

<a href="search.html">

href="gallery.html"
class="active">

Gallery

</nav>

</div>

<main class="gallery-page">


<section class="breadcrumb">

<a href="../index.html">
Home
</a>

<span>/</span>

<a href="gallery.html">
Gallery
</a>

<span>/</span>

<span id="gallery-breadcrumb">
Loading...
</span>

</section>



<section class="gallery-header">


<div class="gallery-cover">

<img
id="gallery-cover-image"
src=""
alt=""
loading="eager">

</div>


<div class="gallery-info">


<h1 id="gallery-title">
Loading...
</h1>


<p id="gallery-description">
</p>


</div>


</section>



<section class="gallery-content">


<h2>
Gallery Images
</h2>


<div
id="preview-container"
class="preview-grid">

</div>


</section>


</main>



<div
id="image-viewer"
class="image-viewer">


<button
id="viewer-close"
class="viewer-close"
aria-label="Close">

×

</button>


<div class="viewer-content">

<img
id="viewer-image"
src=""
alt="">

</div>
