<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Gallery Viewer | DarkensHorns</title>

<link rel="icon"
href="../favicon.ico">

<link rel="stylesheet"
href="../css/variables.css">

<link rel="stylesheet"
href="../css/theme.css">

<link rel="stylesheet"
href="../css/layout.css">

<link rel="stylesheet"
href="../css/header.css">

<link rel="stylesheet"
href="../css/navigation.css">

<link rel="stylesheet"
href="../css/footer.css">

<link rel="stylesheet"
href="../css/gallery.css">

</head>


<body>


<header id="site-header">

<div class="header-container">

<a
href="../index.html"
class="logo">

DarkensHorns

</a>


<nav class="main-navigation">

<a href="../index.html">
Home
</a>

<a href="series.html">
Series
</a>

<a href="search.html">
Search
</a>

<a
href="gallery.html"
class="active">

Gallery

</a>

</nav>

</div>

</header>



<main class="gallery-page">


<section class="breadcrumb">

<a href="../index.html">
Home
</a>

<span>/</span>

<a href="gallery.html">
Gallery
</a>

<span>/</span>

<span id="gallery-breadcrumb">
Loading...
</span>

</section>



<section class="gallery-title-section">

<h1 id="gallery-title">
Loading...
</h1>

</section>



<section class="gallery-reader-controls">

<button
type="button"
id="normal-mode-button"
class="reader-mode-button active">

Normal Mode

</button>


<button
type="button"
id="webtoon-mode-button"
class="reader-mode-button">

Webtoon Mode

</button>

</section>



<section class="gallery-content">


<div
id="preview-container"
class="preview-grid normal-mode">

</div>


</section>


</main>



<div
id="image-viewer"
class="image-viewer">


<button
id="viewer-close"
class="viewer-close"
aria-label="Close">

×

</button>


<div class="viewer-content">

<img
id="viewer-image"
src=""
alt="">

</div>


<div class="viewer-counter"
id="viewer-counter">

</div>


<button
id="viewer-prev"
class="viewer-navigation viewer-prev"
aria-label="Previous image">

‹

</button>


<button
id="viewer-next"
class="viewer-navigation viewer-next"
aria-label="Next image">

›

</button>


</div>



<footer id="site-footer">

<div class="footer-container">

<p>
© 2026 DarkensHorns. All Rights Reserved.
</p>

</div>

</footer>



<script
type="module"
src="../js/gallery-view.js">
</script>


</body>

</html>
